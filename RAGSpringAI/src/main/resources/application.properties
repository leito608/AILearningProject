spring.application.name=RAGSpringAI

#ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.init.pull-model-strategy=when-missing
spring.ai.ollama.init.timeout=5m
spring.ai.ollama.chat.options.model=llama3.2:3b

spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.datasource.url=jdbc:postgresql://localhost:5432/vectordb
spring.datasource.username=testuser
spring.datasource.password=testpwd

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

# Required: with two chat models on the classpath (Ollama + Gemini),
# the auto-configured ChatClient.Builder becomes ambiguous and startup fails.
spring.ai.chat.client.enabled=false