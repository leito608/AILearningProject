<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ถามตอบจากเอกสารของคุณ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f5f1; --panel:#fff; --fg:#1d2321; --mute:#68716d; --line:#d9d8d0;
          --accent:#1f5c4d; --accent-fg:#fff; --user:#e3ede9; --bot:#efeee8; --err:#a3341f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141917; --panel:#1b211f; --fg:#e6ebe8; --mute:#8d9792; --line:#313a36;
            --accent:#58b79e; --accent-fg:#0f1513; --user:#223a33; --bot:#232a27; --err:#ff9b86; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); line-height:1.6;
         font-family:"IBM Plex Sans Thai", system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:1.2rem 1rem 6rem; }
  h1 { font-size:1.4rem; margin:.4rem 0 1rem; }
  h2 { font-size:1rem; margin:0 0 .6rem; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px;
            padding:1rem; margin-bottom:1rem; }
  button { font:inherit; padding:.55rem 1rem; border-radius:8px; border:1px solid var(--accent);
           background:var(--accent); color:var(--accent-fg); cursor:pointer; }
  button.ghost { background:transparent; color:var(--fg); border-color:var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  input[type=text] { font:inherit; flex:1; padding:.6rem .8rem; border-radius:8px;
                     border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
  .hint, #status { color:var(--mute); font-size:.9rem; }
  #status.err { color:var(--err); }
  progress { width:100%; height:8px; margin-top:.5rem; accent-color:var(--accent); }
  ul { list-style:none; margin:.6rem 0 0; padding:0; }
  li { display:flex; justify-content:space-between; gap:.5rem; align-items:center;
       padding:.4rem 0; border-top:1px solid var(--line); }
  li span small { color:var(--mute); }
  .msg { margin:.6rem 0; padding:.7rem .9rem; border-radius:10px; white-space:pre-wrap; }
  .u { background:var(--user); margin-left:2rem; }
  .b { background:var(--bot); margin-right:2rem; }
  .src { font-size:.85rem; color:var(--mute); margin-top:.4rem; }
  #ask { position:fixed; left:0; right:0; bottom:0; background:var(--bg);
         border-top:1px solid var(--line); padding:.7rem 1rem; }
  #ask form { max-width:760px; margin:0 auto; display:flex; gap:.5rem; }
</style>
</head>
<body>
<main>
  <h1>ถามตอบจากเอกสารของคุณ</h1>

  <section>
    <h2>เอกสารของคุณ</h2>
    <div class="row">
      <input id="files" type="file" accept=".txt,.md,.pdf" multiple>
      <button id="upBtn">อัปโหลดและสร้างดัชนี</button>
    </div>
    <p class="hint">รองรับ .txt .md .pdf (PDF ต้องมีตัวอักษรที่เลือกได้ ไม่ใช่ภาพสแกน) ใช้โควตา embedding ฟรีประมาณ 1 ครั้งต่อ 1 ส่วนของเอกสาร</p>
    <progress id="bar" value="0" max="1" hidden></progress>
    <div id="status"></div>
    <ul id="docs"></ul>
  </section>

  <section>
    <h2>บทสนทนา</h2>
    <div id="log"><p class="hint">อัปโหลดเอกสารด้านบน แล้วพิมพ์คำถามที่ช่องด้านล่าง</p></div>
  </section>
</main>

<div id="ask">
  <form id="f">
    <input type="text" id="q" placeholder="พิมพ์คำถามเกี่ยวกับเอกสาร" maxlength="500" autocomplete="off" required>
    <button id="send">ถาม</button>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const API = location.href.split("#")[0].split("?")[0];
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

function status(t, err) { $("status").textContent = t; $("status").className = err ? "err" : ""; }

async function api(body) {
  const r = await fetch(API, {method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify(body)});
  if (r.status === 401) { location.reload(); throw new Error("หมดเวลาเข้าสู่ระบบ"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "ผิดพลาด HTTP " + r.status);
  return j;
}

async function readFile(f) {
  if (/\.pdf$/i.test(f.name)) {
    if (!window.pdfjsLib) throw new Error("โหลดตัวอ่าน PDF ไม่สำเร็จ");
    const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
    let t = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const c = await (await pdf.getPage(i)).getTextContent();
      t += c.items.map(x => x.str).join(" ") + "\n";
    }
    return t;
  }
  return f.text();
}

function chunk(t, size = 800, overlap = 100) {
  t = t.replace(/[ \t]+/g, " ").replace(/\n\s*\n+/g, "\n\n").trim();
  const out = [];
  for (let i = 0; i < t.length; i += size - overlap) out.push(t.slice(i, i + size));
  return out;
}

async function refresh() {
  try {
    const {docs} = await api({action: "list"});
    const ul = $("docs");
    ul.replaceChildren();
    docs.forEach(d => {
      const li = document.createElement("li");
      const s = document.createElement("span");
      s.textContent = d.name + " ";
      const sm = document.createElement("small");
      sm.textContent = `(${d.chunks} ส่วน)`;
      s.appendChild(sm);
      const b = document.createElement("button");
      b.className = "ghost"; b.textContent = "ลบ";
      b.onclick = async () => {
        if (!confirm(`ลบ "${d.name}" ?`)) return;
        await api({action: "delete", name: d.name}); refresh();
      };
      li.append(s, b); ul.appendChild(li);
    });
  } catch (e) { status(e.message, true); }
}

$("upBtn").onclick = async () => {
  const files = [...$("files").files];
  if (!files.length) return status("เลือกไฟล์ก่อน", true);
  $("upBtn").disabled = true; $("bar").hidden = false;
  try {
    for (const f of files) {
      status(`กำลังอ่าน ${f.name}…`);
      const chunks = chunk(await readFile(f));
      if (!chunks.length) { status(`${f.name}: ไม่พบข้อความในไฟล์`, true); continue; }
      if (chunks.length > 300 &&
          !confirm(`${f.name} มี ${chunks.length} ส่วน จะใช้โควตาฟรีหนักและใช้เวลานาน ทำต่อไหม?`)) continue;
      await api({action: "delete", name: f.name});
      const parts = [];
      for (let i = 0; i < chunks.length; i += 10) parts.push(chunks.slice(i, i + 10));
      $("bar").max = parts.length; $("bar").value = 0;
      for (let p = 0; p < parts.length; p++) {
        status(`${f.name}: ส่วนที่ ${p + 1}/${parts.length}`);
        await api({action: "ingest", name: f.name, part: p, chunks: parts[p]});
        $("bar").value = p + 1;
        if (p < parts.length - 1) await sleep(10000); // เลี่ยงขีดจำกัดโทเค็นต่อนาทีของ free tier
      }
    }
    status("อัปโหลดเสร็จแล้ว ถามคำถามได้เลย");
  } catch (e) { status(e.message, true); }
  $("upBtn").disabled = false; $("bar").hidden = true; $("files").value = "";
  refresh();
};

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  if (!$("log").querySelector(".msg")) $("log").replaceChildren();
  $("log").appendChild(d); d.scrollIntoView({block: "end"});
  return d;
}

$("f").onsubmit = async e => {
  e.preventDefault();
  const q = $("q").value.trim(); if (!q) return;
  $("q").value = ""; $("send").disabled = true;
  add("u", q);
  const b = add("b", "กำลังค้นหาคำตอบ…");
  try {
    const j = await api({action: "ask", question: q});
    b.textContent = j.answer;
    if (j.sources.length) {
      const s = document.createElement("div");
      s.className = "src"; s.textContent = "แหล่งที่มา: " + j.sources.join(", ");
      b.appendChild(s);
    }
  } catch (err) { b.textContent = err.message; }
  $("send").disabled = false; $("q").focus();
};

refresh();
</script>
</body>
</html>
